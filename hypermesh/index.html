<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HyperMesh 仿真建模规范</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <script src="excel-files.js"></script>
  <style>
    :root {
      --mint: #7ecec0;
      --mint-light: #e8f6f2;
      --mint-dark: #5ebba9;
      --sky: #7eb8da;
      --sky-soft: #e5f2fa;
      --lavender: #b5a8d8;
      --lavender-soft: #f0edf8;
      --page: #fdfdfb;
      --panel: rgba(255, 254, 252, 0.94);
      --text: #2d3748;
      --muted: #718096;
      --line: rgba(126, 206, 192, 0.2);
      --shadow: 0 12px 32px rgba(126, 206, 192, 0.18);
      --shadow-strong: 0 16px 48px rgba(126, 206, 192, 0.26);
      --table-header-height: 52px;
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --ease-smooth: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--text);
      font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 12% 8%, rgba(126, 206, 192, 0.18), transparent 26rem),
        radial-gradient(circle at 82% 14%, rgba(181, 168, 216, 0.14), transparent 24rem),
        linear-gradient(180deg, #f8fafa 0%, #f5f8f7 52%, #f2f5f3 100%);
    }

    body::before {
      position: fixed;
      inset: 0;
      z-index: -1;
      content: "";
      background-image: radial-gradient(circle, rgba(126, 206, 192, 0.08) 1px, transparent 1px);
      background-size: 24px 24px;
      pointer-events: none;
    }

    .shell {
      width: min(1480px, calc(100% - 40px));
      margin: 0 auto;
      padding: 28px 0 40px;
    }

    .hero {
      position: relative;
      overflow: hidden;
      min-height: 120px;
      padding: 22px 26px;
      border: 1px solid rgba(255, 255, 255, 0.62);
      border-radius: 28px;
      background:
        radial-gradient(ellipse 60% 40% at 30% 30%, rgba(255, 255, 255, 0.22) 0%, transparent 54%),
        linear-gradient(135deg, var(--mint) 0%, var(--sky) 50%, var(--lavender) 100%);
      box-shadow: var(--shadow-strong);
      color: #ffffff;
    }

    .hero::after {
      position: absolute;
      right: -70px;
      bottom: -120px;
      width: 220px;
      height: 220px;
      content: "";
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.18);
      filter: blur(4px);
      animation: floatGlow 10s var(--ease-smooth) infinite alternate;
    }

    .hero-content {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(260px, 330px) auto;
      gap: 18px;
      align-items: center;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(24px, 3vw, 34px);
      line-height: 1.15;
      letter-spacing: 0;
    }

    .subtitle {
      max-width: 760px;
      margin: 0;
      font-size: 14px;
      line-height: 1.65;
      color: rgba(255, 255, 255, 0.88);
    }

    .hero-meta {
      display: grid;
      gap: 10px;
      min-width: 220px;
      padding: 14px 16px;
      border: 1px solid rgba(255, 255, 255, 0.32);
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(14px);
    }

    .meta-label {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.74);
    }

    .meta-value {
      overflow: hidden;
      font-size: 15px;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .module-select-wrap {
      display: grid;
      gap: 8px;
      align-self: center;
      justify-items: center;
      text-align: center;
    }

    .module-label {
      color: rgba(255, 255, 255, 0.78);
      font-size: 12px;
      font-weight: 700;
      text-align: center;
    }

    .module-select {
      width: 100%;
      min-height: 48px;
      padding: 0 40px;
      text-align: center;
      text-align-last: center;
      border: 2px solid rgba(126, 206, 192, 0.18);
      border-radius: 9999px;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.94) 0%, rgba(240, 253, 250, 0.94) 100%);
      box-shadow: 0 8px 24px rgba(126, 206, 192, 0.22);
      color: var(--text);
      cursor: pointer;
      font: inherit;
      font-size: 14px;
      font-weight: 800;
      outline: none;
      appearance: none;
      transition: box-shadow 180ms var(--ease-smooth), transform 180ms var(--ease-spring);
    }

    .module-select-wrap::after {
      align-self: end;
      justify-self: end;
      margin: 0 18px 16px 0;
      content: "⌄";
      color: var(--mint-dark);
      font-size: 18px;
      font-weight: 900;
      pointer-events: none;
    }

    .module-select:focus {
      transform: translateY(-2px);
      box-shadow: 0 0 0 4px rgba(126, 206, 192, 0.18), 0 10px 26px rgba(126, 206, 192, 0.24);
    }


    .table-card {
      overflow: hidden;
      border: 2px solid rgba(126, 206, 192, 0.12);
      border-radius: 30px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .table-scroll {
      max-height: calc(100vh - 250px);
      min-height: 360px;
      overflow: auto;
    }

    table {
      width: 100%;
      min-width: 980px;
      border-collapse: separate;
      border-spacing: 0;
      font-size: 14px;
    }

    th,
    td {
      max-width: 340px;
      padding: 13px 14px;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      line-height: 1.55;
      text-align: left;
      vertical-align: top;
      white-space: pre-line;
      word-break: break-word;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 4;
      background: linear-gradient(135deg, #eefaf7 0%, #eaf6fb 100%);
      color: var(--text);
      font-weight: 800;
    }

    tbody tr {
      background: rgba(255, 254, 252, 0.72);
      transition: background 160ms var(--ease-smooth);
    }

    tbody tr:nth-child(even) {
      background: rgba(232, 246, 242, 0.28);
    }

    tbody tr:hover {
      background: linear-gradient(135deg, rgba(232, 246, 242, 0.86) 0%, rgba(126, 184, 218, 0.1) 100%);
    }

    .section-row td {
      position: sticky;
      top: var(--table-header-height);
      z-index: 3;
      background: linear-gradient(135deg, var(--sky-soft) 0%, var(--lavender-soft) 100%);
      color: var(--text);
      font-weight: 800;
      text-align: center;
      box-shadow: 0 8px 18px rgba(126, 206, 192, 0.12);
    }


    .empty-cell {
      color: #a0aec0;
    }

    .message {
      padding: 28px;
      color: var(--muted);
      font-weight: 700;
      line-height: 1.8;
    }

    .error {
      color: #c05656;
      background: #fed7d7;
    }

    @keyframes floatGlow {
      from {
        transform: translateY(0) rotate(0deg);
      }
      to {
        transform: translateY(-18px) rotate(8deg);
      }
    }

    @media (max-width: 900px) {
      .shell {
        width: min(100% - 24px, 1480px);
        padding-top: 16px;
      }

      .hero {
        padding: 28px 24px;
        border-radius: 30px;
      }

      .hero-content,
      .module-select-wrap {
        grid-template-columns: 1fr;
      }

      .hero-meta {
        min-width: 0;
      }

      .table-scroll {
        max-height: none;
      }

    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="hero">
      <div class="hero-content">
        <div>
          <h1>HyperMesh 仿真建模规范</h1>
          <p class="subtitle">按模块查看建模命名、单元类型、材料与基础单元尺寸。页面内容来自同目录 Excel，更新 Excel 后即可同步展示。</p>
        </div>
        <div class="module-select-wrap">
          <label class="module-label" for="moduleSelect">模块选择</label>
          <select class="module-select" id="moduleSelect" aria-label="选择建模规范模块"></select>
        </div>
        <div class="hero-meta">
          <span class="meta-label">当前 Excel</span>
          <span class="meta-value" id="fileName">仿真建模规范-手机.xlsx</span>
          <span class="meta-label">当前模块</span>
          <span class="meta-value" id="activeSheet">加载中</span>
        </div>
      </div>
    </section>

    <section class="table-card">
      <div class="table-scroll" id="tableWrap">
        <div class="message">正在读取同目录 Excel...</div>
      </div>
    </section>
  </main>

  <script>
    const state = {
      workbook: null,
      sheets: [],
      activeSheet: "",
      fileName: ""
    };

    const moduleSelectEl = document.getElementById("moduleSelect");
    const tableWrapEl = document.getElementById("tableWrap");
    const fileNameEl = document.getElementById("fileName");
    const activeSheetEl = document.getElementById("activeSheet");

    function setMessage(text, isError = false) {
      tableWrapEl.innerHTML = "";
      const message = document.createElement("div");
      message.className = `message${isError ? " error" : ""}`;
      message.textContent = text;
      tableWrapEl.appendChild(message);
    }

    function normalizeRows(sheet) {
      const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });
      return rows
        .map((row) => {
          const clean = [...row];
          while (clean.length && clean[0] === "") clean.shift();
          while (clean.length && clean[clean.length - 1] === "") clean.pop();
          return clean;
        })
        .filter((row) => row.some((cell) => String(cell).trim() !== ""));
    }

    function detectHeaderIndex(rows) {
      const index = rows.findIndex((row) => String(row[0]).trim() === "序号");
      return index >= 0 ? index : 0;
    }

    function rowIsSection(row) {
      const nonEmpty = row.filter((cell) => String(cell).trim() !== "");
      if (nonEmpty.length !== 1) return false;
      const text = String(nonEmpty[0]).trim();
      return text.includes("规范") || text.includes("部件") || text.includes("简化版") || text.includes("详细版") || text.startsWith("注：") || text.includes("名称全部");
    }

    function renderModuleSelect() {
      moduleSelectEl.innerHTML = "";
      state.sheets.forEach((sheetName) => {
        const option = document.createElement("option");
        option.value = sheetName;
        option.textContent = sheetName;
        option.selected = sheetName === state.activeSheet;
        moduleSelectEl.appendChild(option);
      });
    }

    function renderTable() {
      const sheet = state.workbook.Sheets[state.activeSheet];
      const rows = normalizeRows(sheet);
      const headerIndex = detectHeaderIndex(rows);
      const maxCols = rows.reduce((max, row) => Math.max(max, row.length), 0);
      const header = rows[headerIndex] || [];
      const bodyRows = rows.filter((_, index) => index !== headerIndex);

      tableWrapEl.innerHTML = "";
      const table = document.createElement("table");
      const thead = document.createElement("thead");
      const tbody = document.createElement("tbody");
      const headerTr = document.createElement("tr");

      for (let col = 0; col < maxCols; col += 1) {
        const th = document.createElement("th");
        th.textContent = header[col] || `列 ${col + 1}`;
        headerTr.appendChild(th);
      }

      thead.appendChild(headerTr);
      bodyRows.forEach((row) => {
        const tr = document.createElement("tr");
        if (rowIsSection(row)) {
          tr.className = "section-row";
          const td = document.createElement("td");
          td.colSpan = maxCols;
          td.textContent = row.find((cell) => String(cell).trim() !== "") || "";
          tr.appendChild(td);
          tbody.appendChild(tr);
          return;
        }
        for (let col = 0; col < maxCols; col += 1) {
          const td = document.createElement("td");
          const value = row[col] ?? "";
          if (value === "") {
            td.textContent = "—";
            td.className = "empty-cell";
          } else {
            td.textContent = String(value);
          }
          tr.appendChild(td);
        }
        tbody.appendChild(tr);
      });

      table.append(thead, tbody);
      tableWrapEl.appendChild(table);
      requestAnimationFrame(() => {
        const headerHeight = thead.getBoundingClientRect().height;
        tableWrapEl.style.setProperty("--table-header-height", `${Math.ceil(headerHeight)}px`);
      });
      fileNameEl.textContent = state.fileName;
      activeSheetEl.textContent = state.activeSheet;
    }

    function loadWorkbookFromArrayBuffer(buffer, fileName) {
      state.workbook = XLSX.read(buffer, { type: "array" });
      state.sheets = state.workbook.SheetNames;
      state.activeSheet = state.sheets[0] || "";
      state.fileName = fileName;
      if (!state.activeSheet) {
        setMessage("Excel 中未找到任何 sheet。", true);
        return;
      }
      renderModuleSelect();
      renderTable();
    }

    async function getDefaultExcelFile() {
      const files = window.HYPERMESH_EXCEL_FILES || [];
      if (!Array.isArray(files) || files.length === 0) {
        throw new Error("manifest is empty");
      }
      return files.find((fileName) => /\.xlsx?$/i.test(fileName)) || files[0];
    }

    async function loadDefaultWorkbook() {
      try {
        const excelFile = await getDefaultExcelFile();
        const response = await fetch(encodeURI(excelFile), { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const buffer = await response.arrayBuffer();
        loadWorkbookFromArrayBuffer(buffer, excelFile);
      } catch (error) {
        console.error(error);
        setMessage("未能自动读取同目录第一个 Excel。请确认 excel-files.js 已列出 Excel 文件，并通过本地 HTTP 服务打开本页。", true);
      }
    }

    moduleSelectEl.addEventListener("change", (event) => {
      state.activeSheet = event.target.value;
      renderTable();
    });

    loadDefaultWorkbook();
  </script>
</body>
</html>
